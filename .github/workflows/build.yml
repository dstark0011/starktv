name: Build StarkTV

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Name it
        run: cp app/build/outputs/apk/release/app-release.apk StarkTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: StarkTV-apk
          path: StarkTV.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: StarkTV build ${{ github.run_number }}
          body: Install on Fire TV with the Downloader app.
          files: StarkTV.apk
          make_latest: true
