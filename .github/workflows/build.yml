name: Build StarkTV

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find the project
        id: proj
        run: |
          f=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          if [ -z "$f" ]; then
            echo "::error::settings.gradle.kts isn't in the repo – upload all the files from the zip"
            find . -not -path './.git/*' | head -60
            exit 1
          fi
          echo "Project found in: $(dirname "$f")"
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - name: Build the APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Name it
        run: cp "${{ steps.proj.outputs.dir }}/app/build/outputs/apk/release/app-release.apk" StarkTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: StarkTV-apk
          path: StarkTV.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: StarkTV build ${{ github.run_number }}
          body: Install on Fire TV with the Downloader app.
          files: StarkTV.apk
          make_latest: true
