name: Build StarkTV
# Each build is listed under its version and what's new (from CHANGELOG.md),
# e.g. "StarkTV 4.5 — Resume really resumes", instead of "Add files via upload".
run-name: ${{ inputs.title || github.event.head_commit.message }}

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      title:
        description: Name for this build
        required: false
        default: ''

permissions:
  contents: write
  actions: write

jobs:
  # An upload from the phone: read the version from the CHANGELOG in the zip
  # and start the real build under that name (this short run is removed afterwards).
  name-it:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Start the build under its proper name
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for z in $(find . -maxdepth 2 -name '*.zip' -not -path './.git/*'); do
            unzip -o -q "$z" -d .
          done
          cl=$(find . -name CHANGELOG.md -not -path './.git/*' | head -1)
          head=""
          [ -n "$cl" ] && head=$(grep -m1 '^## ' "$cl" | sed 's/^## *//')
          [ -z "$head" ] && head=$(git log -1 --format=%s)
          echo "Building: StarkTV $head"
          gh workflow run "${{ github.workflow }}" --ref main -f title="StarkTV $head"

  build:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find the project
        id: proj
        run: |
          # the project may have been uploaded as a zip – unpack it
          for z in $(find . -maxdepth 2 -name '*.zip' -not -path './.git/*'); do
            unzip -o -q "$z" -d .
          done
          f=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          if [ -z "$f" ]; then
            echo "::error::settings.gradle.kts isn't in the repo or the zip"
            find . -not -path './.git/*' | head -60
            exit 1
          fi
          echo "Project found in: $(dirname "$f")"
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - name: What's new (for the release page)
        id: notes
        run: |
          cl=$(find . -name CHANGELOG.md -not -path './.git/*' | head -1)
          v=$(grep -m1 'versionName' "${{ steps.proj.outputs.dir }}/app/build.gradle.kts" | sed -E 's/.*"([0-9]+\.[0-9]+)\..*/\1/')
          title=$(grep -m1 '^## ' "$cl" | sed -E 's/^## *[0-9.]+ *//; s/^(—|–|-) *//')
          echo "name=StarkTV $v.${{ github.run_number }} — $title" >> "$GITHUB_OUTPUT"
          awk 'f && /^## /{exit} /^## /{f=1; next} f' "$cl" > notes.md
          printf '\nInstall on the Fire Stick / phone: https://github.com/%s/releases/latest/download/StarkTV.apk\n' "${{ github.repository }}" >> notes.md
          printf 'Windows: https://github.com/%s/releases/latest/download/StarkTV-Windows.zip (unzip, then run the StarkTV exe inside)\n' "${{ github.repository }}" >> notes.md

      - name: Build the APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Name it
        run: cp "${{ steps.proj.outputs.dir }}/app/build/outputs/apk/release/app-release.apk" StarkTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: StarkTV-apk
          path: StarkTV.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ${{ steps.notes.outputs.name }}
          body_path: notes.md
          files: StarkTV.apk
          make_latest: true

      - name: Hand the source to the Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows-src
          path: |
            ${{ steps.proj.outputs.dir }}/windows
            ${{ steps.proj.outputs.dir }}/app/build.gradle.kts
          if-no-files-found: ignore

      - name: Tidy the list (remove the short "Add files via upload" runs)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list -R "${{ github.repository }}" --workflow "${{ github.workflow }}" --event push --status completed --limit 50 \
            --json databaseId -q '.[].databaseId' | xargs -r -n1 gh run delete -R "${{ github.repository }}" || true

  # Windows version: a portable StarkTV folder (zip) added to the same release
  windows:
    needs: build
    if: github.event_name != 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-src
          path: src
        continue-on-error: true
      - name: Is there a Windows version in this upload?
        id: has
        shell: bash
        run: |
          d=$(dirname "$(find src -name main.js -path '*windows*' | head -1)")
          if [ -z "$d" ] || [ "$d" = "." ]; then echo "No windows/ folder in the upload – skipping"; echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "dir=$d" >> "$GITHUB_OUTPUT"; echo "ok=true" >> "$GITHUB_OUTPUT"
          v=$(grep -m1 'versionName' $(find src -name build.gradle.kts | head -1) | sed -E 's/.*"([0-9]+\.[0-9]+)\..*/\1/')
          echo "v=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.has.outputs.ok == 'true'
        with:
          node-version: '20'
      - name: Package StarkTV.exe
        if: steps.has.outputs.ok == 'true'
        shell: bash
        working-directory: ${{ steps.has.outputs.dir }}
        run: |
          npm pkg set version="${{ steps.has.outputs.v }}.${{ github.run_number }}"
          npm install --no-audit --no-fund
          mkdir -p app/vendor
          cp node_modules/hls.js/dist/hls.min.js app/vendor/
          cp node_modules/mpegts.js/dist/mpegts.js app/vendor/
          npx @electron/packager . "StarkTV v${{ steps.has.outputs.v }}" --platform=win32 --arch=x64 --icon=starktv.ico --out=dist --overwrite \
            --ignore="^/dist" --ignore="^/README.txt" --app-copyright="StarkTV"
          cd dist && mv "StarkTV v${{ steps.has.outputs.v }}-win32-x64" StarkTV
          7z a -tzip "$GITHUB_WORKSPACE/StarkTV-Windows.zip" StarkTV > /dev/null
          ls -la "$GITHUB_WORKSPACE"
      - uses: softprops/action-gh-release@v2
        if: steps.has.outputs.ok == 'true'
        with:
          tag_name: build-${{ github.run_number }}
          files: StarkTV-Windows.zip
